# Modo desarrollo: monta el código en vivo y recarga automáticamente al guardar.
# Se carga automáticamente junto a docker-compose.yml en `docker compose up -d`.
# Para un despliegue sin auto-reload, ejecuta con `-f docker-compose.yml` únicamente.

services:
  api:
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
